{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="report-card">
      <div class="text-center mb-5">
        <div class="report-icon">🚩</div>

        <h1>Report Post</h1>

        <p class="subtitle">Help keep RateMyMeal safe and high quality.</p>
      </div>

      <div class="reported-post">
        <div class="small-label">Reporting</div>

        <h3>{{ post.title }}</h3>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="report-form">{{ form.as_p }}</div>

        <div class="action-zone">
          <button class="btn btn-danger">Submit Report</button>

          <a
            href="{% url 'post-detail' post.id %}"
            class="btn btn-outline-light"
          >
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .report-card {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    padding: 60px;

    border-radius: 34px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .report-icon {
    width: 120px;

    height: 120px;

    margin: auto;

    margin-bottom: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 54px;

    border-radius: 50%;

    background: linear-gradient(
      135deg,
      rgba(229, 57, 53, 0.12),
      rgba(255, 122, 0, 0.12)
    );
  }

  .report-card h1 {
    font-size: 3rem;

    font-weight: 900;

    margin-bottom: 12px;

    letter-spacing: -1px;
  }

  .subtitle {
    font-size: 1.08rem;

    color: #777;
  }

  .reported-post {
    padding: 30px;

    border-radius: 24px;

    background: rgba(255, 122, 0, 0.06);

    border: 2px solid rgba(255, 122, 0, 0.1);

    margin-bottom: 36px;

    text-align: center;
  }

  .small-label {
    font-size: 0.82rem;

    font-weight: 800;

    color: #e53935;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 10px;
  }

  .reported-post h3 {
    margin: 0;

    font-size: 1.7rem;

    font-weight: 900;

    word-break: break-word;
  }

  .report-form p {
    margin-bottom: 26px;
  }

  .report-form label {
    display: block;

    margin-bottom: 10px;

    font-weight: 800;

    color: #222;
  }

  .report-form input,
  .report-form textarea,
  .report-form select {
    width: 100%;

    padding: 18px;

    border-radius: 18px;

    border: 2px solid rgba(0, 0, 0, 0.08);

    background: white;

    transition: all 0.25s ease;
  }

  .report-form textarea {
    min-height: 220px;

    resize: vertical;

    line-height: 1.8;
  }

  .report-form input:focus,
  .report-form textarea:focus,
  .report-form select:focus {
    outline: none;

    border-color: #ff7a00;

    box-shadow: 0 0 0 6px rgba(255, 122, 0, 0.12);

    transform: scale(1.01);
  }

  .action-zone {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 16px;

    margin-top: 40px;
  }

  .btn-danger {
    min-height: 66px;

    border: none;

    border-radius: 20px;

    font-size: 1.05rem;

    font-weight: 900;

    background: linear-gradient(135deg, #e53935, #c62828);

    box-shadow: 0 18px 40px rgba(229, 57, 53, 0.28);
  }

  .btn-danger:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .btn-outline-light {
    min-height: 66px;

    border-radius: 20px;

    background: white;

    border: 2px solid rgba(0, 0, 0, 0.08);

    font-weight: 800;

    color: #222;
  }

  .btn-outline-light:hover {
    background: #fff8f0;

    transform: translateY(-2px);
  }

  @media (max-width: 768px) {
    .report-card {
      padding: 36px;

      border-radius: 24px;
    }

    .report-card h1 {
      font-size: 2.2rem;
    }

    .action-zone {
      grid-template-columns: 1fr;
    }
  }
</style>

{% endblock %}
