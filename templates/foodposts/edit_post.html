{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow p-5">

            <h2 class="mb-4">
                Edit Post
            </h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-warning">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
