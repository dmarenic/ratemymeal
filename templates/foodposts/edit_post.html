{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="edit-post-card">
      <div class="header text-center mb-5">
        <div class="hero-icon"><i class="bi bi-pencil-fill"></i></div>

        <h1>Edit Post</h1>

        <p>Update your meal and keep your food story fresh.</p>
      </div>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="post-form">{{ form.as_p }}</div>

        <div class="d-grid mt-5">
          <button class="btn btn-warning">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .hero-icon i {
    color: #e53935;
  }

  .edit-post-card {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    padding: 60px;

    border-radius: 34px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .hero-icon {
    width: 110px;

    height: 110px;

    margin: auto;

    margin-bottom: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    font-size: 48px;

    background: linear-gradient(
      135deg,
      rgba(255, 122, 0, 0.18),
      rgba(229, 57, 53, 0.14)
    );
  }

  .header h1 {
    font-size: 3rem;

    font-weight: 900;

    margin-bottom: 14px;

    letter-spacing: -1px;
  }

  .header p {
    color: #666;

    font-size: 1.1rem;
  }

  .post-form p {
    margin-bottom: 26px;
  }

  .post-form label {
    display: block;

    margin-bottom: 10px;

    font-weight: 800;

    color: #222;
  }

  .post-form input,
  .post-form textarea,
  .post-form select {
    width: 100%;

    padding: 18px;

    border-radius: 18px;

    border: 2px solid rgba(0, 0, 0, 0.08);

    background: white;

    transition: all 0.25s ease;
  }

  .post-form textarea {
    min-height: 180px;

    resize: vertical;
  }

  .post-form input:focus,
  .post-form textarea:focus,
  .post-form select:focus {
    outline: none;

    border-color: #ff7a00;

    box-shadow: 0 0 0 6px rgba(255, 122, 0, 0.12);

    transform: scale(1.01);
  }

  .post-form input[type="file"] {
    padding: 20px;

    cursor: pointer;

    background: linear-gradient(180deg, white, #fff8f0);
  }

  .btn-warning {
    min-height: 66px;

    font-size: 1.05rem;

    font-weight: 900;

    border: none;

    border-radius: 20px;

    background: linear-gradient(135deg, #ff7a00, #e53935);

    color: white;

    box-shadow: 0 18px 40px rgba(255, 122, 0, 0.28);

    transition: all 0.25s ease;
  }

  .btn-warning:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .btn-warning:active {
    transform: scale(0.98);
  }

  @media (max-width: 768px) {
    .edit-post-card {
      padding: 36px;

      border-radius: 24px;
    }

    .header h1 {
      font-size: 2.2rem;
    }
  }
</style>

{% endblock %}
