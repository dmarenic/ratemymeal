{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="comment-editor">
      <div class="text-center mb-5">
        <div class="editor-icon"><i class="bi bi-pencil-fill"></i></div>

        <h1>Edit Comment</h1>

        <p>Refine your opinion and improve your food review.</p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="comment-form">{{ form.as_p }}</div>

        <div class="d-grid mt-5">
          <button class="btn btn-warning">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .editor-icon i {
    color: #ff7a00;
  }

  .comment-editor {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    padding: 60px;

    border-radius: 34px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .editor-icon {
    width: 110px;

    height: 110px;

    margin: auto;

    margin-bottom: 24px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 48px;

    border-radius: 50%;

    background: linear-gradient(
      135deg,
      rgba(255, 122, 0, 0.18),
      rgba(229, 57, 53, 0.14)
    );
  }

  .comment-editor h1 {
    font-size: 3rem;

    font-weight: 900;

    margin-bottom: 12px;

    letter-spacing: -1px;
  }

  .comment-editor p {
    font-size: 1.08rem;

    color: #666;
  }

  .comment-form p {
    margin-bottom: 28px;
  }

  .comment-form label {
    display: block;

    margin-bottom: 10px;

    font-weight: 800;

    color: #222;
  }

  .comment-form input,
  .comment-form textarea {
    width: 100%;

    padding: 18px;

    border-radius: 18px;

    border: 2px solid rgba(0, 0, 0, 0.08);

    background: white;

    transition: all 0.25s ease;
  }

  .comment-form textarea {
    min-height: 220px;

    resize: vertical;

    line-height: 1.8;
  }

  .comment-form input:focus,
  .comment-form textarea:focus {
    outline: none;

    border-color: #ff7a00;

    box-shadow: 0 0 0 6px rgba(255, 122, 0, 0.12);

    transform: scale(1.01);
  }

  .btn-warning {
    min-height: 66px;

    border: none;

    border-radius: 20px;

    font-size: 1.05rem;

    font-weight: 900;

    background: linear-gradient(135deg, #ff7a00, #e53935);

    color: white;

    box-shadow: 0 18px 40px rgba(255, 122, 0, 0.3);

    transition: all 0.25s ease;
  }

  .btn-warning:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .btn-warning:active {
    transform: scale(0.98);
  }

  @media (max-width: 768px) {
    .comment-editor {
      padding: 36px;

      border-radius: 24px;
    }

    .comment-editor h1 {
      font-size: 2.2rem;
    }

    .comment-form textarea {
      min-height: 180px;
    }
  }
</style>

{% endblock %}
