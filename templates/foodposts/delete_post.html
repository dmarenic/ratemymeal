{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-5 text-center">

    <h2>
        Delete Post
    </h2>

    <p class="mt-3">

        Are you sure you want to delete
        "{{ post.title }}"?

    </p>

    <form method="POST">

        {% csrf_token %}

        <button class="btn btn-danger">
            Yes, delete
        </button>

        <a
            href="{% url 'post-detail' post.id %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
