{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="delete-card">
      <div class="text-center">
        <div class="warning-icon">🗑️</div>

        <h1>Delete Post</h1>

        <p class="subtitle">This action cannot be undone.</p>
      </div>

      <div class="warning-box">
        <p>You are about to permanently remove:</p>

        <h3>"{{ post.title }}"</h3>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="action-buttons">
          <button class="btn btn-danger">Delete Permanently</button>

          <a
            href="{% url 'post-detail' post.id %}"
            class="btn btn-outline-light"
          >
            Keep Post
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .delete-card {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    padding: 60px;

    border-radius: 34px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .warning-icon {
    width: 120px;

    height: 120px;

    margin: auto;

    margin-bottom: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 52px;

    border-radius: 50%;

    background: linear-gradient(
      135deg,
      rgba(229, 57, 53, 0.12),
      rgba(255, 122, 0, 0.1)
    );
  }

  .delete-card h1 {
    font-size: 3rem;

    font-weight: 900;

    margin-bottom: 10px;

    letter-spacing: -1px;
  }

  .subtitle {
    font-size: 1.08rem;

    color: #777;

    margin-bottom: 40px;
  }

  .warning-box {
    padding: 30px;

    border-radius: 24px;

    background: rgba(229, 57, 53, 0.06);

    border: 2px solid rgba(229, 57, 53, 0.1);

    text-align: center;

    margin-bottom: 40px;
  }

  .warning-box p {
    margin-bottom: 10px;

    color: #666;
  }

  .warning-box h3 {
    font-size: 1.6rem;

    font-weight: 900;

    color: #e53935;

    margin: 0;

    word-break: break-word;
  }

  .action-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 16px;
  }

  .btn-danger {
    min-height: 66px;

    border: none;

    border-radius: 20px;

    font-size: 1.05rem;

    font-weight: 900;

    background: linear-gradient(135deg, #e53935, #c62828);

    box-shadow: 0 18px 40px rgba(229, 57, 53, 0.28);
  }

  .btn-danger:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .btn-outline-light {
    min-height: 66px;

    border-radius: 20px;

    font-weight: 800;

    background: white;

    border: 2px solid rgba(0, 0, 0, 0.08);

    color: #222;
  }

  .btn-outline-light:hover {
    background: #fff8f0;

    transform: translateY(-2px);
  }

  @media (max-width: 768px) {
    .delete-card {
      padding: 36px;

      border-radius: 24px;
    }

    .delete-card h1 {
      font-size: 2.2rem;
    }

    .action-buttons {
      grid-template-columns: 1fr;
    }
  }
</style>

{% endblock %}
