{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-5">

    <img
        src="{{ restaurant.image.url }}"
        class="img-fluid rounded mb-4"
    >

    <h1>
        {{ restaurant.name }}
    </h1>

    <p class="text-muted">

        {{ restaurant.city }}

    </p>

    <p>

        {{ restaurant.address }}

    </p>

    <hr>

    <p>

        {{ restaurant.description }}

    </p>

</div>

{% endblock %}
