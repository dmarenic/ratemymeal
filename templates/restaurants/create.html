{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="create-card">
      <div class="text-center mb-5">
        <div class="hero-icon mb-4">🍽️</div>

        <h1 class="hero-title">Create Restaurant</h1>

        <p class="hero-subtitle">
          Add a new restaurant and let the community discover it.
        </p>
      </div>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="restaurant-form">{{ form.as_p }}</div>

        <div class="d-grid mt-5">
          <button class="btn btn-warning py-3">Save Restaurant</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .create-card {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    padding: 60px;

    border-radius: 32px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .hero-icon {
    width: 110px;

    height: 110px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 50px;

    border-radius: 50%;

    background: linear-gradient(
      135deg,
      rgba(255, 122, 0, 0.18),
      rgba(229, 57, 53, 0.14)
    );
  }

  .hero-title {
    font-size: 3rem;

    font-weight: 900;

    margin-bottom: 12px;

    letter-spacing: -1px;
  }

  .hero-subtitle {
    font-size: 1.1rem;

    color: #666;

    max-width: 520px;

    margin: auto;
  }

  .restaurant-form p {
    margin-bottom: 24px;
  }

  .restaurant-form label {
    display: block;

    font-size: 15px;

    font-weight: 800;

    margin-bottom: 10px;

    color: #222;
  }

  .restaurant-form input,
  .restaurant-form textarea,
  .restaurant-form select {
    width: 100%;

    padding: 18px;

    border-radius: 18px;

    border: 2px solid rgba(0, 0, 0, 0.08);

    background: #fff;

    transition: all 0.25s ease;
  }

  .restaurant-form textarea {
    min-height: 160px;

    resize: vertical;
  }

  .restaurant-form input:focus,
  .restaurant-form textarea:focus,
  .restaurant-form select:focus {
    outline: none;

    border-color: #ff7a00;

    box-shadow: 0 0 0 6px rgba(255, 122, 0, 0.12);

    transform: scale(1.01);
  }

  .restaurant-form input[type="file"] {
    padding: 20px;

    cursor: pointer;

    background: linear-gradient(180deg, white, #fff8f0);
  }

  .d-grid .btn-warning {
    min-height: 64px;
    font-size: 1.05rem;
    font-weight: 900;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff7a00, #e53935);
    color: white;
    box-shadow: 0 18px 40px rgba(255, 122, 0, 0.28);
    transition: all 0.25s ease;
  }

  .d-grid .btn-warning:hover {
    transform: translateY(-2px) scale(1.02);
  }

  .d-grid .btn-warning:active {
    transform: scale(0.98);
  }

  @media (max-width: 768px) {
    .create-card {
      padding: 36px;

      border-radius: 24px;
    }

    .hero-title {
      font-size: 2.2rem;
    }
  }
</style>

{% endblock %}
