{% extends 'base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="edit-card">
      <div class="text-center mb-5">
        <div class="edit-icon mb-3"><i class="bi bi-person-circle"></i></div>

        <h1 class="fw-bold">Edit Profile</h1>

        <p class="text-muted">
          Update your profile and make your food identity stand out.
        </p>
      </div>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="profile-form">
          {{ user_form.as_p }} {{ profile_form.as_p }}
        </div>

        <div class="d-grid mt-4">
          <button class="btn btn-warning py-3">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .edit-icon i {
    color: #e53935;
  }

  .edit-card {
    background: linear-gradient(180deg, #ffffff, #fff8f0);

    border-radius: 32px;

    padding: 56px;

    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
  }

  .edit-icon {
    width: 100px;

    height: 100px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    font-size: 42px;

    background: linear-gradient(
      135deg,
      rgba(255, 122, 0, 0.18),
      rgba(229, 57, 53, 0.12)
    );
  }

  .profile-form p {
    margin-bottom: 22px;
  }

  .profile-form label {
    display: block;

    margin-bottom: 10px;

    font-weight: 700;

    color: #222;
  }

  .profile-form input,
  .profile-form textarea,
  .profile-form select {
    width: 100%;

    min-height: 58px;

    padding: 16px 18px;

    border-radius: 18px;

    border: 2px solid rgba(0, 0, 0, 0.08);

    background: #fff;

    transition: all 0.25s ease;
  }

  .profile-form textarea {
    min-height: 140px;

    resize: vertical;
  }

  .profile-form input:focus,
  .profile-form textarea:focus,
  .profile-form select:focus {
    outline: none;

    border-color: #ff7a00;

    box-shadow: 0 0 0 6px rgba(255, 122, 0, 0.12);

    transform: scale(1.01);
  }

  .profile-form input[type="file"] {
    padding: 18px;

    background: linear-gradient(180deg, white, #fff8f0);

    cursor: pointer;
  }

  .btn-warning {
    min-height: 64px;

    border: none;

    border-radius: 20px;

    font-size: 1.05rem;

    font-weight: 800;

    background: linear-gradient(135deg, #ff7a00, #e53935);

    color: white;

    box-shadow: 0 16px 36px rgba(255, 122, 0, 0.3);
  }

  .btn-warning:hover {
    transform: translateY(-2px) scale(1.02);
  }

  .btn-warning:active {
    transform: scale(0.98);
  }

  @media (max-width: 768px) {
    .edit-card {
      padding: 34px;

      border-radius: 24px;
    }
  }
</style>

{% endblock %}
