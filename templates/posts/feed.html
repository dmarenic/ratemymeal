{% extends 'base.html' %}

{% block content %}

<h1 class="mb-5">
    Home Feed
</h1>

<div class="row">

    {% for post in posts %}

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img
                    src="{{ post.image.url }}"
                    class="card-img-top"
                    height="250"
                    style="object-fit: cover;"
                >

                <div class="card-body">

                    <h5>
                        {{ post.title }}
                    </h5>

                    <p>
                        {{ post.description|truncatewords:15 }}
                    </p>

                    <span class="badge bg-warning text-dark">
                        {{ post.cuisine }}
                    </span>

                    <p class="mt-3">
                        ⭐ {{ post.rating }}/5
                    </p>

                    <small>
                        by {{ post.author.username }}
                    </small>

                </div>

            </div>

        </div>

    {% empty %}

        <h4>
            No posts yet.
        </h4>

    {% endfor %}

</div>

{% endblock %}
