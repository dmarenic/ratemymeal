{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow p-5">

            <h2 class="mb-4">
                Create Verified Review
            </h2>

            <p class="text-muted">
                Reviewing post: <strong>{{ post.title }}</strong>
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-warning">
                    Publish Verified Review
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
